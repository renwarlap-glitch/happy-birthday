<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ڕۆژی لە دایک بونت پیرۆز ئاسودە🤍</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: #090a16;
            background: radial-gradient(circle at center, #1a1c38 0%, #080914 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
            padding: 15px;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Perfectly Mobile-Centered Responsive Card */
        .card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 380px;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5),
                        0 0 30px rgba(236, 72, 153, 0.2);
            text-align: center;
            margin: auto;
        }

        .badge {
            display: inline-block;
            padding: 5px 16px;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.6), 0 0 30px rgba(236, 72, 153, 0.4);
            margin-bottom: 20px;
            line-height: 1.35;
        }

        /* Realistic Cake Design */
        .cake-container {
            position: relative;
            width: 160px;
            height: 140px;
            margin: 10px auto 20px auto;
            cursor: pointer;
        }

        .plate {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 12px;
            background: linear-gradient(90deg, #94a3b8, #f8fafc, #94a3b8);
            border-radius: 100px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.6);
        }

        .cake-body {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 80px;
            background: linear-gradient(180deg, #f472b6 0%, #db2777 100%);
            border-radius: 12px 12px 6px 6px;
            box-shadow: inset 0 -10px 0 rgba(0,0,0,0.15);
        }

        .icing {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 25px;
            background: #ffffff;
            border-radius: 12px 12px 15px 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .cherry {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 20px;
            background: #ef4444;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .candle {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 35px;
            background: repeating-linear-gradient(45deg, #facc15, #facc15 5px, #ffffff 5px, #ffffff 10px);
            border-radius: 3px;
            box-shadow: 0 0 8px rgba(250, 204, 21, 0.4);
        }

        .flame {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 24px;
            background: linear-gradient(to top, #ff4500, #ffbe0b, #ffffff);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px #ffbe0b, 0 0 25px #ff4500;
            animation: flicker 0.6s infinite alternate ease-in-out;
            transition: opacity 0.4s, transform 0.4s;
        }

        .flame.off {
            opacity: 0;
            transform: translateX(-50%) scale(0);
        }

        /* Smoke Effect */
        .smoke {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 15px;
            background: rgba(200, 200, 200, 0.6);
            border-radius: 10px;
            opacity: 0;
            pointer-events: none;
        }

        .smoke.active {
            animation: smokeRise 1.5s forwards ease-out;
        }

        @keyframes smokeRise {
            0% { opacity: 0.8; transform: translateX(-50%) translateY(0) scale(1); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-30px) scale(3); }
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1) rotate(-2deg); }
            100% { transform: translateX(-50%) scale(1.15) rotate(2deg); }
        }

        .hint-text {
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: none;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #1e1b4b;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 25px;
            max-width: 320px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.7);
        }

        .modal-content h2 {
            color: #f472b6;
            font-size: 1.4rem;
            margin-bottom: 12px;
        }

        .modal-content p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #e2e8f0;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="card">
        <div class="badge">✨ 20th Birthday ✨</div>
        <h1>ڕۆژی لە دایک بونت پیرۆز ئاسودە🤍</h1>

        <div class="cake-container" onclick="blowCandle()">
            <div class="plate"></div>
            <div class="cake-body">
                <div class="icing"></div>
            </div>
            <div class="cherry"></div>
            <div class="candle">
                <div class="flame" id="flame"></div>
                <div class="smoke" id="smoke"></div>
            </div>
        </div>

        <div class="hint-text">(پەنجە لە مۆمەکە بدە بۆ کوژاندنەوەی 🕯️)</div>

        <div class="btn-group">
            <button class="btn" onclick="launchFireworks()">تەقاندنی یاری ئاگرینی 🎆</button>
            <button class="btn btn-secondary" onclick="openModal()">پەیامی تایبەت 💌</button>
        </div>
    </div>

    <!-- Modal Popup -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2>ئاسودەی ئازیز 🌸</h2>
            <p>
                بەبۆنەی ۲۰ ساڵیی تەمەنتەوە، جوانترین پیرۆزباییت لێدەکەم! 
                هیودارم ئەم ساڵە نوێیەی تەمەنت پڕ بێت لە بەختەوەری، سەرکەوتن و هێنانەدی هەموو ئاواتە جوانەکانت. 🤍✨
            </p>
            <button class="btn" style="width: 100%;" onclick="closeModal()">داخستن</button>
        </div>
    </div>

    <script>
        // Audio Effects
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(freq, type, duration) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // Canvas Fireworks
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let rockets = [];
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Rocket {
            constructor() {
                this.x = canvas.width / 2 + (Math.random() * 160 - 80);
                this.y = canvas.height;
                this.targetX = Math.random() * (canvas.width * 0.8) + (canvas.width * 0.1);
                this.targetY = Math.random() * (canvas.height * 0.4) + 60;
                this.speed = 8;
                this.angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                playSound(300, 'sine', 0.2);
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (Math.hypot(this.targetX - this.x, this.targetY - this.y) < 10) {
                    this.explode();
                    return false;
                }
                return true;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
            }

            explode() {
                playSound(100, 'square', 0.3);
                confetti({
                    particleCount: 40,
                    spread: 60,
                    origin: { x: this.x / canvas.width, y: this.y / canvas.height }
                });
            }
        }

        function loop() {
            ctx.fillStyle = 'rgba(9, 10, 22, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            rockets = rockets.filter(r => {
                r.draw();
                return r.update();
            });

            requestAnimationFrame(loop);
        }
        loop();

        function launchFireworks() {
            for (let i = 0; i < 4; i++) {
                setTimeout(() => {
                    rockets.push(new Rocket());
                }, i * 250);
            }
        }

        function blowCandle() {
            const flame = document.getElementById('flame');
            const smoke = document.getElementById('smoke');
            if (!flame.classList.contains('off')) {
                flame.classList.add('off');
                smoke.classList.add('active');
                launchFireworks();
            } else {
                flame.classList.remove('off');
                smoke.classList.remove('active');
            }
        }

        function openModal() {
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // Auto launch on load
        setTimeout(launchFireworks, 600);
    </script>
</body>
</html>
