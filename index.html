<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ڕۆژی لەدایکبوونت پیرۆز ئاسودە خان 🎆🎂</title>
    <!-- کێشەرەوەی کاغەزی بریقەدار و ئاگرین -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f0c29;
            background: linear-gradient(to right, #24243e, #302b63, #0f0c29);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
            overflow-x: hidden;
            text-align: center;
        }

        /* کاستی ئاگرین لە پاشبنەما */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 100%;
        }

        .age-badge {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            padding: 6px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1rem;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
            animation: pulse 2s infinite;
        }

        h1 {
            font-size: 2.2rem;
            color: #ff79c6;
            text-shadow: 0 0 10px rgba(255, 121, 198, 0.5);
            margin-bottom: 5px;
        }

        .name {
            font-size: 2.8rem;
            color: #f1fa8c;
            text-shadow: 0 0 15px rgba(241, 250, 138, 0.8);
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* دیزاینی کێک */
        .cake-wrapper {
            margin: 25px 0;
            cursor: pointer;
            display: inline-block;
        }

        .cake {
            width: 140px;
            height: 100px;
            background: #ffb86c;
            border-radius: 15px 15px 0 0;
            position: relative;
            margin: 0 auto;
            box-shadow: 0 8px 0 #ff922b, inset 0 15px 0 #fff;
        }

        .cake::before {
            content: '';
            position: absolute;
            top: 45px;
            left: 0;
            width: 100%;
            height: 12px;
            background: #ff5555;
        }

        .candle {
            width: 12px;
            height: 35px;
            background: repeating-linear-gradient(45deg, #8be9fd, #8be9fd 5px, #fff 5px, #fff 10px);
            margin: 0 auto;
            position: relative;
            border-radius: 4px 4px 0 0;
        }

        .flame {
            width: 14px;
            height: 22px;
            background: #ffb86c;
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            top: -22px;
            left: -1px;
            box-shadow: 0 0 15px #ffb86c, 0 0 30px #ff5555;
            animation: burn 0.5s infinite alternate;
            transition: opacity 0.5s ease;
        }

        .flame.off {
            opacity: 0;
        }

        /* دوگمەی یاری ئاگرینی دەستی */
        .btn-firework {
            background: linear-gradient(45deg, #ff5555, #ffb86c);
            color: #fff;
            border: none;
            padding: 12px 28px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(255, 85, 85, 0.4);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-firework:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 25px rgba(255, 85, 85, 0.6);
        }

        .hint-text {
            font-size: 0.85rem;
            color: #bd93f9;
            margin-top: 8px;
        }

        @keyframes burn {
            0% { transform: scale(1) rotate(-2deg); }
            100% { transform: scale(1.15) rotate(2deg); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- کێشەری ئاگرین -->
    <canvas id="fireworksCanvas"></canvas>

    <div class="container">
        <div class="age-badge">Turning 20 Years Old! ✨</div>
        <h1>ڕۆژی لەدایکبوونت پیرۆز</h1>
        <div class="name">ئاسودە خان 🌸</div>

        <!-- کێک و مۆم -->
        <div class="cake-wrapper" onclick="extinguishCandle()">
            <div class="candle">
                <div class="flame" id="flame"></div>
            </div>
            <div class="cake"></div>
            <div class="hint-text">(پەنجە لە مۆمەکە بدە بۆ فوی لێکردن 🕯️)</div>
        </div>

        <br>

        <button class="btn-firework" onclick="launchFireworks()">تەقاندنی یاری ئاگرینی 🎆</button>
    </div>

    <script>
        // تەقاندنی ڕاستەوخۆی یاری ئاگرینی
        function launchFireworks() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 1000 };

            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();

              if (timeLeft <= 0) {
                return clearInterval(interval);
              }

              var particleCount = 50 * (timeLeft / duration);
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        // کوژاندنەوەی مۆم
        function extinguishCandle() {
            var flame = document.getElementById('flame');
            if(!flame.classList.contains('off')) {
                flame.classList.add('off');
                launchFireworks();
            }
        }

        // یاری ئاگرینی ئۆتۆماتیکی لە کاتی باوەڕپێکردنی لاپەڕەکە
        window.onload = function() {
            setTimeout(launchFireworks, 500);
        };
    </script>
</body>
</html>
