<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ڕۆژی لە دایک بونت پیرۆز ئاسودە🤍</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #020208;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #fff;
            text-align: center;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 10;
            background: rgba(15, 15, 30, 0.65);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 35px 25px;
            border-radius: 30px;
            box-shadow: 0 0 50px rgba(180, 0, 255, 0.2);
            max-width: 420px;
            width: 90%;
        }

        .age-tag {
            background: linear-gradient(90deg, #ff007f, #7928ca);
            padding: 6px 20px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
            letter-spacing: 1px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 30px rgba(255, 0, 127, 0.6);
            margin-bottom: 25px;
            line-height: 1.3;
        }

        /* Anime Style Realistic Cake */
        .cake-container {
            position: relative;
            width: 160px;
            height: 140px;
            margin: 20px auto;
            cursor: pointer;
        }

        .plate {
            width: 180px;
            height: 12px;
            background: #e0e0e0;
            background: linear-gradient(to right, #999, #fff, #999);
            border-radius: 10px;
            position: absolute;
            bottom: 0;
            left: -10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .layer {
            position: absolute;
            width: 140px;
            border-radius: 12px 12px 8px 8px;
            left: 10px;
        }

        .layer-bottom {
            height: 50px;
            bottom: 12px;
            background: linear-gradient(180deg, #ff85a1, #f72585);
            box-shadow: inset 0 -8px 0 rgba(0,0,0,0.15);
        }

        .layer-top {
            height: 45px;
            bottom: 55px;
            width: 110px;
            left: 25px;
            background: linear-gradient(180deg, #ffb703, #fb8500);
            box-shadow: inset 0 -6px 0 rgba(0,0,0,0.15);
        }

        .cream-drip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 15px;
            background: #fff;
            border-radius: 10px 10px 8px 8px;
        }

        .candle {
            width: 10px;
            height: 35px;
            background: repeating-linear-gradient(45deg, #00f0ff, #00f0ff 5px, #fff 5px, #fff 10px);
            position: absolute;
            top: 12px;
            left: 75px;
            border-radius: 3px;
            box-shadow: 0 0 5px rgba(0, 240, 255, 0.5);
        }

        .flame {
            width: 14px;
            height: 22px;
            background: #ffbe0b;
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            top: -22px;
            left: -2px;
            box-shadow: 0 0 15px #ffbe0b, 0 0 25px #ff007f;
            animation: animeFlame 0.6s infinite alternate ease-in-out;
            transition: opacity 0.4s;
        }

        .flame.off {
            opacity: 0;
        }

        @keyframes animeFlame {
            0% { transform: scale(1) rotate(-3deg); }
            100% { transform: scale(1.2) rotate(3deg); }
        }

        .btn-launch {
            background: linear-gradient(45deg, #7928ca, #ff007f);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
            transition: transform 0.2s;
            margin-top: 15px;
        }

        .btn-launch:active {
            transform: scale(0.95);
        }

        .sub-text {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="card">
        <div class="age-tag">20th Birthday ✨</div>
        <h1>ڕۆژی لە دایک بونت پیرۆز ئاسودە🤍</h1>

        <div class="cake-container" onclick="blowCandle()">
            <div class="plate"></div>
            <div class="layer layer-bottom">
                <div class="cream-drip"></div>
            </div>
            <div class="layer layer-top">
                <div class="cream-drip"></div>
            </div>
            <div class="candle">
                <div class="flame" id="flame"></div>
            </div>
        </div>

        <button class="btn-launch" onclick="userLaunch()">تەقاندنی یاری ئاگرینی 🎆</button>
        <div class="sub-text">(کلیک لە کێکەکە یان دوگمەکە بکە 🔊)</div>
    </div>

    <script>
        // Audio Synthesizer for Sound Effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playLaunchSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        function playExplodeSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const bufferSize = audioCtx.sampleRate * 0.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(800, audioCtx.currentTime);
            filter.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.5);
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
        }

        // Canvas Fireworks Engine
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let rockets = [];
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Rocket {
            constructor(targetX, targetY) {
                this.x = canvas.width / 2 + (Math.random() * 200 - 100);
                this.y = canvas.height;
                this.targetX = targetX || Math.random() * canvas.width;
                this.targetY = targetY || Math.random() * (canvas.height * 0.5);
                this.speed = 8;
                this.angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                playLaunchSound();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (Math.hypot(this.targetX - this.x, this.targetY - this.y) < 10) {
                    this.explode();
                    return false;
                }
                return true;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
            }

            explode() {
                playExplodeSound();
                const colors = ['#ff007f', '#00f0ff', '#ffbe0b', '#7928ca', '#00ff66'];
                const color = colors[Math.floor(Math.random() * colors.length)];
                for (let i = 0; i < 60; i++) {
                    particles.push(new Particle(this.x, this.y, color));
                }
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.friction = 0.96;
                this.gravity = 0.15;
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.015;
                return this.alpha > 0;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(2, 2, 8, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            rockets = rockets.filter(r => {
                r.draw();
                return r.update();
            });

            particles = particles.filter(p => {
                p.draw();
                return p.update();
            });

            requestAnimationFrame(animate);
        }
        animate();

        function userLaunch() {
            for(let i=0; i<3; i++) {
                setTimeout(() => {
                    rockets.push(new Rocket());
                }, i * 300);
            }
        }

        function blowCandle() {
            document.getElementById('flame').classList.add('off');
            userLaunch();
        }

        // Auto launch on start
        setTimeout(userLaunch, 800);
    </script>
</body>
</html>
