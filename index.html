<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ڕۆژی لە دایک بونت پیرۆز ئاسودە🤍</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: #05050d;
            background: radial-gradient(circle at center, #111328 0%, #030308 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
            padding: 15px;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 380px;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(236, 72, 153, 0.25);
            text-align: center;
            margin: auto;
        }

        .badge {
            display: inline-block;
            padding: 5px 16px;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.6), 0 0 30px rgba(236, 72, 153, 0.4);
            margin-bottom: 20px;
            line-height: 1.35;
        }

        /* Cake & Candle */
        .cake-container {
            position: relative;
            width: 160px;
            height: 140px;
            margin: 10px auto 15px auto;
            cursor: pointer;
        }

        .plate {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 12px;
            background: linear-gradient(90deg, #94a3b8, #f8fafc, #94a3b8);
            border-radius: 100px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.6);
        }

        .cake-body {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 80px;
            background: linear-gradient(180deg, #f472b6 0%, #db2777 100%);
            border-radius: 12px 12px 6px 6px;
            box-shadow: inset 0 -10px 0 rgba(0,0,0,0.15);
        }

        .icing {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 25px;
            background: #ffffff;
            border-radius: 12px 12px 15px 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .cherry {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 20px;
            background: #ef4444;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .candle {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 35px;
            background: repeating-linear-gradient(45deg, #facc15, #facc15 5px, #ffffff 5px, #ffffff 10px);
            border-radius: 3px;
            box-shadow: 0 0 8px rgba(250, 204, 21, 0.4);
        }

        .flame {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 24px;
            background: linear-gradient(to top, #ff4500, #ffbe0b, #ffffff);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px #ffbe0b, 0 0 25px #ff4500;
            animation: flicker 0.6s infinite alternate ease-in-out;
            transition: opacity 0.4s, transform 0.4s;
        }

        .flame.off {
            opacity: 0;
            transform: translateX(-50%) scale(0);
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1) rotate(-2deg); }
            100% { transform: translateX(-50%) scale(1.15) rotate(2deg); }
        }

        .hint-text {
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: none;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #1e1b4b;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 25px;
            max-width: 320px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.7);
        }

        .modal-content h2 {
            color: #f472b6;
            font-size: 1.4rem;
            margin-bottom: 12px;
        }

        .modal-content p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #e2e8f0;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="card">
        <div class="badge">✨ 20th Birthday ✨</div>
        <h1>ڕۆژی لە دایک بونت پیرۆز ئاسودە🤍</h1>

        <div class="cake-container" onclick="blowCandle()">
            <div class="plate"></div>
            <div class="cake-body">
                <div class="icing"></div>
            </div>
            <div class="cherry"></div>
            <div class="candle">
                <div class="flame" id="flame"></div>
            </div>
        </div>

        <div class="hint-text">(کلیک لە مۆمەکە یان دوگمەکە بکە 🕯️)</div>

        <div class="btn-group">
            <button class="btn" onclick="launchFireworksShow()">تەقاندنی یاری ئاگرینی 🎆</button>
            <button class="btn btn-secondary" onclick="openModal()">پەیامی تایبەت 💌</button>
        </div>
    </div>

    <!-- Modal Popup -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2>ئاسودەی ئازیز 🌸</h2>
            <p>
                بەبۆنەی ۲۰ ساڵیی تەمەنتەوە، جوانترین پیرۆزباییت لێدەکەم! 
                هیودارم ئەم ساڵە نوێیەی تەمەنت پڕ بێت لە بەختەوەری، سەرکەوتن و هێنانەدی هەموو ئاواتە جوانەکانت. 🤍✨
            </p>
            <button class="btn" style="width: 100%;" onclick="closeModal()">داخستن</button>
        </div>
    </div>

    <script>
        // Real Christmas Fireworks Audio Synthesizer
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playLaunchSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        function playExplodeSound() {
            initAudio();
            const bufferSize = audioCtx.sampleRate * 0.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(700, audioCtx.currentTime);
            filter.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.5);
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
        }

        // Professional Canvas Fireworks Engine
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let rockets = [];
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Rocket {
            constructor() {
                this.x = canvas.width / 2 + (Math.random() * 200 - 100);
                this.y = canvas.height;
                this.targetX = Math.random() * (canvas.width * 0.8) + (canvas.width * 0.1);
                this.targetY = Math.random() * (canvas.height * 0.45) + 60;
                this.speed = 9;
                this.angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                playLaunchSound();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (Math.hypot(this.targetX - this.x, this.targetY - this.y) < 12) {
                    this.explode();
                    return false;
                }
                return true;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            }

            explode() {
                playExplodeSound();
                const colors = ['#ec4899', '#38bdf8', '#facc15', '#a855f7', '#4ade80', '#f43f5e'];
                const color = colors[Math.floor(Math.random() * colors.length)];
                for (let i = 0; i < 65; i++) {
                    particles.push(new Particle(this.x, this.y, color));
                }
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6.5 + 1.5;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.friction = 0.95;
                this.gravity = 0.12;
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.016;
                return this.alpha > 0;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.8, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function loop() {
            ctx.fillStyle = 'rgba(5, 5, 13, 0.22)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            rockets = rockets.filter(r => {
                r.draw();
                return r.update();
            });

            particles = particles.filter(p => {
                p.draw();
                return p.update();
            });

            requestAnimationFrame(loop);
        }
        loop();

        function launchFireworksShow() {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    rockets.push(new Rocket());
                }, i * 280);
            }
        }

        function blowCandle() {
            const flame = document.getElementById('flame');
            flame.classList.toggle('off');
            launchFireworksShow();
        }

        function openModal() {
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // Auto fireworks on start
        setTimeout(launchFireworksShow, 600);
    </script>
</body>
</html>
